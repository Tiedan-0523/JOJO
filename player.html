<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参与抽奖</title>
  <style>
    body{background:#eef6ff;font-family:Arial;padding:20px}
    .card{background:white;border-radius:16px;padding:24px;max-width:400px;margin:0 auto;box-shadow:0 4px 12px #00000010}
    input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px}
    button{background:#0077ff;color:white;border:none;padding:14px;border-radius:10px;width:100%;font-size:16px}
    .success{display:none;text-align:center;color:#00b850;font-weight:bold;margin-top:20px}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="text-align:center;color:#0077ff">参与直播抽奖</h2>
    <input id="nickname" placeholder="输入昵称">
    <input id="phone" placeholder="输入手机号">
    <select id="answer" class="hidden">
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
    </select>
    <button onclick="join()">提交参与</button>
    <div class="success" id="success">✅ 参与成功！等待开奖</div>
  </div>

  <script>
    // 读取配置
    let cfg = JSON.parse(localStorage.getItem('lotteryConfig') || '{}');
    if (cfg.joinType === 'quiz') {
      document.getElementById('answer').classList.remove('hidden');
    }

    function join() {
      let nickname = document.getElementById('nickname').value.trim();
      let phone = document.getElementById('phone').value.trim();
      if (!nickname || !phone) {
        alert('请填写昵称和手机号');
        return;
      }

      let users = JSON.parse(localStorage.getItem('lotteryUsers') || '[]');
      users.push({
        nickname: nickname,
        phone: phone,
        answer: document.getElementById('answer').value
      });
      localStorage.setItem('lotteryUsers', JSON.stringify(users));

      document.getElementById('success').style.display = 'block';
    }
  </script>
</body>
</html>
