<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>直播抽奖管理端</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#165DFF', secondary: '#4080FF' }
        }
      }
    }
  </script>
  <style>
    .glass { background: rgba(255,255,255,0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.18); border-radius: 24px; }
    .glass-dark { background: rgba(255,255,255,0.15); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-sky-50 min-h-screen p-4 font-sans">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold text-center text-[#165DFF] my-6">✨ 直播抽奖管理后台</h1>

    <div class="glass p-6 md:p-8 mb-6">
      <h3 class="font-semibold mb-4">抽奖配置</h3>
      <div class="mb-3">中奖人数：<input type="number" id="winCount" value="1" class="border p-2 rounded w-full"></div>
      <div class="mb-3">参与条件：
        <select id="joinType" class="border p-2 rounded w-full">
          <option value="free">无条件</option>
          <option value="quiz">答题ABC</option>
        </select>
      </div>
      <div id="answerWrap" class="mb-3 hidden">正确答案：
        <select id="correctAnswer" class="border p-2 rounded w-full">
          <option value="A">A</option><option value="B">B</option><option value="C">C</option>
        </select>
      </div>
      <button onclick="createLottery()" class="bg-[#165DFF] text-white p-3 rounded w-full">生成抽奖二维码</button>
    </div>

    <div class="glass p-6 text-center mb-6">
      <div id="qrcode"></div>
    </div>

    <div class="glass p-6 mb-6">
      <h3 class="font-semibold">参与用户：<span id="userCount">0</span> 人</h3>
      <div id="userList" class="grid grid-cols-2 gap-2 mt-3"></div>
    </div>

    <button onclick="doLottery()" class="bg-green-500 text-white p-3 rounded w-full text-lg font-bold">立即开奖</button>
    <div id="result" class="text-center mt-4 text-xl font-bold text-[#165DFF]"></div>
  </div>

  <script>
    let config = { winCount:1, joinType:"free", correctAnswer:"A" }
    let users = []

    // 🔥 已经改成你的真实地址了！
    const playerUrl = "https://tiedan-0523.github.io/JOJO/player.html"

    document.getElementById("joinType").addEventListener("change", function(e){
      document.getElementById("answerWrap").classList.toggle("hidden", e.target.value === "free")
    })

    function createLottery() {
      config.winCount = parseInt(document.getElementById("winCount").value)
      config.joinType = document.getElementById("joinType").value
      config.correctAnswer = document.getElementById("correctAnswer").value
      localStorage.setItem("lotteryConfig", JSON.stringify(config))
      users = []
      localStorage.removeItem("lotteryUsers")
      document.getElementById("result").innerText = "✅ 已创建抽奖！"

      // 生成二维码
      QRCode.toCanvas(document.getElementById("qrcode"), playerUrl, {
        width: 220, color: { dark:"#165DFF", light:"#ffffff" }
      })
    }

    setInterval(() => {
      let list = JSON.parse(localStorage.getItem("lotteryUsers") || "[]")
      users = list
      document.getElementById("userCount").innerText = users.length
      let el = document.getElementById("userList")
      el.innerHTML = ""
      users.forEach((u,i) => {
        let d = document.createElement("div")
        d.innerText = (i+1)+". "+u.nickname
        d.className = "bg-white/50 p-2 rounded"
        el.appendChild(d)
      })
    }, 1000)

    function doLottery() {
      if(users.length===0) return alert("暂无用户")
      let candidates = config.joinType==="quiz" ? users.filter(u=>u.answer===config.correctAnswer) : users
      let winUsers = candidates.sort(()=>Math.random()-0.5).slice(0, config.winCount)
      document.getElementById("result").innerText = "🎉 中奖：" + winUsers.map(u=>u.nickname).join(" / ")
    }
  </script>
</body>
</html>
