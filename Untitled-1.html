<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>直播抽奖管理端</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#4080FF',
            accent: '#0FC6C2'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .glass {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .glass-dark {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .btn-hover {
        @apply transition-all duration-300 hover:scale-105 active:scale-95;
      }
      .card-shadow {
        box-shadow: 0 8px 32px rgba(22, 93, 255, 0.1);
      }
    }
  </style>
</head>
<body class="font-inter bg-gradient-to-br from-blue-50 via-indigo-50 to-sky-50 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <!-- 标题 -->
    <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-center text-primary mb-8 tracking-tight">
      ✨ 直播抽奖管理后台
    </h1>

    <!-- 主卡片 毛玻璃 -->
    <div class="glass rounded-3xl card-shadow p-6 md:p-10 mb-8">
      <h2 class="text-lg md:text-xl font-semibold text-gray-700 mb-6">抽奖配置</h2>
      
      <div class="grid gap-5 mb-8">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2">中奖人数</label>
          <input 
            id="winCount" type="number" min="1" value="1"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
          >
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2">参与条件</label>
          <select 
            id="joinType"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
          >
            <option value="free">无条件参与</option>
            <option value="quiz">回答问题（ABC）</option>
          </select>
        </div>
        
        <div id="answerWrap" class="hidden">
          <label class="block text-sm font-medium text-gray-600 mb-2">正确答案</label>
          <select 
            id="correctAnswer"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
          >
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
        </div>
      </div>
      
      <!-- 生成按钮 -->
      <button 
        onclick="createLottery()" 
        class="w-full bg-gradient-to-r from-primary to-secondary text-white font-semibold py-3.5 rounded-xl btn-hover shadow-lg shadow-primary/25"
      >
        生成抽奖二维码
      </button>
    </div>

    <!-- 二维码区域 -->
    <div class="glass rounded-3xl p-8 text-center mb-8">
      <div id="qrcode" class="inline-block p-3 glass-dark rounded-2xl"></div>
    </div>

    <!-- 参与列表 -->
    <div class="glass rounded-3xl p-6 md:p-8 mb-8">
      <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
        <span>👥 当前参与用户</span>
        <span id="userCount" class="text-sm bg-primary/10 text-primary px-2 py-1 rounded-full">0</span>
      </h2>
      <div id="userList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    </div>

    <!-- 开奖按钮 -->
    <button 
      onclick="doLottery()" 
      class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-4 rounded-xl btn-hover shadow-lg shadow-green-500/25 text-lg"
    >
      🎁 立即开奖
    </button>

    <!-- 中奖结果 -->
    <div id="result" class="mt-6 text-center text-[clamp(1.2rem,2vw,1.8rem)] font-bold text-primary py-4 px-6 glass-dark rounded-2xl min-h-[80px] flex items-center justify-center"></div>
  </div>

  <script>
    let config = { winCount: 1, joinType: 'free', correctAnswer: 'A' }
    let users = []
    const userList = document.getElementById('userList')
    const result = document.getElementById('result')
    const userCount = document.getElementById('userCount')

    // 切换条件
    document.getElementById('joinType').addEventListener('change', function(e) {
      document.getElementById('answerWrap').classList.toggle('hidden', e.target.value === 'free')
    })

    // 创建抽奖
    function createLottery() {
      config.winCount = parseInt(document.getElementById('winCount').value)
      config.joinType = document.getElementById('joinType').value
      config.correctAnswer = document.getElementById('correctAnswer').value
      
      localStorage.setItem('lotteryConfig', JSON.stringify(config))
      users = []
      localStorage.removeItem('lotteryUsers')
      renderUsers()
      result.innerHTML = ''
      
      // 生成二维码
      QRCode.toCanvas(document.getElementById('qrcode'), `${location.origin}${location.pathname.replace('admin.html','')}player.html`, {
        width: 220, margin: 1, color: {
          dark: '#165DFF',
          light: '#ffffff'
        }
      }, (error) => { if (error) console.error(error) })
      
      // 动画提示
      result.innerHTML = "✅ 抽奖已创建，观众可扫码参与"
      setTimeout(() => result.innerHTML = '', 2000)
    }

    // 实时监听用户
    setInterval(() => {
      let list = JSON.parse(localStorage.getItem('lotteryUsers') || '[]')
      if (JSON.stringify(list) !== JSON.stringify(users)) {
        users = list
        renderUsers()
      }
    }, 1000)

    // 渲染用户列表
    function renderUsers() {
      userList.innerHTML = ''
      userCount.innerText = users.length
      
      users.forEach((u, i) => {
        let div = document.createElement('div')
        div.className = 'bg-white/50 px-3 py-2 rounded-xl text-center text-sm md:text-base border border-white/50 animate-fadein'
        div.innerText = `${i+1}. ${u.nickname}`
        userList.appendChild(div)
      })
    }

    // 开奖逻辑
    function doLottery() {
      if (users.length === 0) return result.innerHTML = '😥 暂无用户参与'
      
      let candidates = config.joinType === 'quiz'
        ? users.filter(u => u.answer === config.correctAnswer)
        : users
      
      if (candidates.length === 0) return result.innerHTML = '😥 暂无答对观众，无法开奖'
      
      let winCount = Math.min(config.winCount, candidates.length)
      let shuffle = [...candidates].sort(() => Math.random() - 0.5)
      let winners = shuffle.slice(0, winCount)
      
      // 开奖动画
      result.innerHTML = '🎲 开奖中...'
      setTimeout(() => {
        result.innerHTML = '🎉 中奖者：' + winners.map(w => w.nickname).join('　')
      }, 600)
    }
  </script>
</body>
</html>
