<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直播抽奖管理端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#165DFF' },
          fontFamily: { inter: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .glass {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .btn-hover {
      transition: all 0.3s;
    }
    .btn-hover:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body class="font-inter bg-gradient-to-br from-blue-50 via-indigo-50 to-sky-50 min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold text-center text-primary my-6">✨ 直播抽奖管理后台</h1>

    <div class="glass rounded-3xl p-6 md:p-8 mb-6">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">中奖人数</label>
        <input id="winCount" type="number" min="1" value="1" class="w-full border p-3 rounded-xl">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">参与条件</label>
        <select id="joinType" class="w-full border p-3 rounded-xl">
          <option value="free">无条件参与</option>
          <option value="quiz">回答问题（ABC）</option>
        </select>
      </div>

      <div id="answerWrap" class="mb-4 hidden">
        <label class="block text-sm font-medium text-gray-600 mb-1">正确答案</label>
        <select id="correctAnswer" class="w-full border p-3 rounded-xl">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </div>

      <button onclick="createQR()" class="w-full bg-primary text-white py-3.5 rounded-xl btn-hover">生成抽奖二维码</button>
    </div>

    <div class="glass rounded-3xl p-6 text-center mb-6">
      <div id="qrcode" class="inline-block"></div>
    </div>

    <div class="glass rounded-3xl p-6">
      <button onclick="doLottery()" class="w-full bg-green-500 text-white py-3.5 rounded-xl btn-hover text-lg font-bold">立即开奖</button>
      <div id="result" class="mt-4 text-center text-xl font-bold text-primary"></div>
    </div>
  </div>

  <script>
    const playerUrl = "https://tiedan-0523.github.io/JOJO/player.html";

    document.getElementById('joinType').addEventListener('change', function(e) {
      document.getElementById('answerWrap').classList.toggle('hidden', e.target.value === 'free');
    });

    // ✅ 安全二维码生成（不报错、手机可扫）
    function createQR() {
      document.getElementById('qrcode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&color=165DFF&data=${encodeURIComponent(playerUrl)}">`;
      localStorage.setItem('lotteryConfig', JSON.stringify({
        winCount: document.getElementById('winCount').value,
        joinType: document.getElementById('joinType').value,
        correctAnswer: document.getElementById('correctAnswer').value
      }));
      localStorage.removeItem('lotteryUsers');
      document.getElementById('result').innerText = "✅ 已启动，观众可扫码参与";
    }

    // 开奖逻辑
    function doLottery() {
      let users = JSON.parse(localStorage.getItem('lotteryUsers') || '[]');
      let config = JSON.parse(localStorage.getItem('lotteryConfig') || '{}');
      let result = document.getElementById('result');

      if (users.length === 0) return result.innerText = "暂无参与用户";
      let candidates = config.joinType === 'quiz' ? users.filter(u => u.answer === config.correctAnswer) : users;
      if (candidates.length === 0) return result.innerText = "暂无符合条件用户";

      let winners = candidates.sort(() => Math.random() - 0.5).slice(0, config.winCount);
      result.innerText = "🎉 中奖者：" + winners.map(w => w.nickname).join("　");
    }
  </script>
</body>
</html>
