<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>直播抽奖管理端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#165DFF'},fontFamily:{inter:['Inter','sans-serif']}}}}</script>
  <style>.glass{background:rgba(255,255,255,0.3);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);}</style>
</head>
<body class="font-inter bg-gradient-to-br from-blue-50 via-indigo-50 to-sky-50 min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-primary my-6">✨ 直播抽奖管理后台</h1>

    <div class="glass rounded-3xl p-6 mb-6">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">中奖人数</label>
        <input id="winCount" type="number" min="1" value="1" class="w-full border p-3 rounded-xl">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">参与模式</label>
        <select id="joinType" class="w-full border p-3 rounded-xl">
          <option value="free">无条件参与</option>
          <option value="quiz">答题ABC</option>
        </select>
      </div>
      <div id="answerWrap" class="mb-4 hidden">
        <label class="block text-sm font-medium mb-1">正确答案</label>
        <select id="correctAnswer" class="w-full border p-3 rounded-xl">
          <option value="A">A</option><option value="B">B</option><option value="C">C</option>
        </select>
      </div>
      <button onclick="create()" class="w-full bg-primary text-white py-3 rounded-xl hover:scale-105 transition">生成抽奖二维码</button>
    </div>

    <div class="glass rounded-3xl p-6 text-center mb-6">
      <div id="qrcode" class="inline-block"></div>
    </div>

    <div class="glass rounded-3xl p-6 mb-6">
      <h3 class="font-semibold mb-2">当前参与列表 (<span id="userCount">0</span>)</h3>
      <div id="userList" class="grid grid-cols-2 gap-2"></div>
    </div>

    <div class="glass rounded-3xl p-6">
      <button onclick="lottery()" class="w-full bg-green-500 text-white py-3 rounded-xl text-lg font-bold">立即开奖</button>
      <div id="result" class="mt-4 text-center text-xl font-bold text-primary"></div>
    </div>
  </div>

  <script>
    const playerUrl = "https://tiedan-0523.github.io/JOJO/player.html";

    document.getElementById('joinType').addEventListener('change',function(e){
      document.getElementById('answerWrap').classList.toggle('hidden',e.target.value==='free');
    });

    function create(){
      document.getElementById('qrcode').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&color=165DFF&data=${encodeURIComponent(playerUrl)}">`;
      localStorage.setItem('cfg',JSON.stringify({
        winCount:document.getElementById('winCount').value,
        joinType:document.getElementById('joinType').value,
        correctAnswer:document.getElementById('correctAnswer').value
      }));
      localStorage.removeItem('allUsers');
    }

    function loadUsers(){
      let users=JSON.parse(localStorage.getItem('allUsers')||'[]');
      let list=document.getElementById('userList');
      list.innerHTML='';
      users.forEach(u=>{
        let div=document.createElement('div');
        div.className='bg-white/50 p-2 rounded';
        div.innerText=u.nickname;
        list.appendChild(div);
      });
      document.getElementById('userCount').innerText=users.length;
    }

    function lottery(){
      let users=JSON.parse(localStorage.getItem('allUsers')||'[]');
      let cfg=JSON.parse(localStorage.getItem('cfg')||'{}');
      if(users.length===0)return document.getElementById('result').innerText='暂无用户';
      let candidates=cfg.joinType==='quiz'?users.filter(u=>u.answer===cfg.correctAnswer):users;
      if(candidates.length===0)return document.getElementById('result').innerText='无符合条件用户';
      let win=candidates.sort(()=>Math.random()-0.5).slice(0,cfg.winCount);
      document.getElementById('result').innerText='🎉 中奖：'+win.map(w=>w.nickname).join('、');
    }

    setInterval(loadUsers,2000);
  </script>
</body>
</html>
